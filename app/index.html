<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokedanex</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="capcalera">
    <div class="fila-marca">
      <div class="marca">
        <h1>Pokedanex</h1>
        <!-- El logotip del set (que omple el JavaScript) és alhora el botó
             que obre el selector d'expansions (selector-expansions.js) -->
        <button type="button" id="boto-expansions" class="boto-expansions"
                aria-haspopup="dialog" data-i18n-aria="expansions.obrir">
          <img id="logo-set" class="logo-set" src="" alt="" hidden>
          <span class="caret" aria-hidden="true">▾</span>
        </button>
      </div>
      <div class="control">
        <label for="selector-idioma" data-i18n="idioma.etiqueta">Idioma</label>
        <select id="selector-idioma">
          <option value="ca">Català</option>
          <option value="es">Castellano</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <div class="fila-controls">
      <input id="cercador" class="cercador" type="search" autocomplete="off"
             placeholder="" data-i18n-placeholder="cerca.placeholder">
      <div class="control">
        <span class="control-etiqueta" data-i18n="vista.etiqueta">Vista</span>
        <!-- Commutador de vista: graella clàssica o àlbum realista -->
        <div id="commutador-vista" class="segmentat">
          <button type="button" class="actiu" data-vista="graella" data-i18n="vista.graella">Graella</button>
          <button type="button" data-vista="album" data-i18n="vista.album">Àlbum</button>
        </div>
      </div>
      <div class="control">
        <span class="control-etiqueta" data-i18n="visual.etiqueta">Visualització</span>
        <!-- Mode de visualització: col·lecció (cartes pendents apagades)
             o catàleg (totes a color, amb marc daurat a les tingudes) -->
        <div id="mode-visual" class="segmentat">
          <button type="button" class="actiu" data-visual="colleccio" data-i18n="visual.colleccio">Col·lecció</button>
          <button type="button" data-visual="cataleg" data-i18n="visual.cataleg">Catàleg</button>
        </div>
      </div>
      <div class="control">
        <span class="control-etiqueta" data-i18n="marcar.etiqueta">Marcar</span>
        <!-- Mode de marcatge: en mode variant, clic esquerre sobre una carta
             suma una còpia d'aquesta variant i clic dret en resta una -->
        <div id="mode-marcatge" class="segmentat">
          <button type="button" class="actiu" data-mode="consulta" data-i18n="marcar.consulta">Consulta</button>
          <button type="button" data-mode="normal" data-i18n="marcar.normal">Normal</button>
          <button type="button" data-mode="reverse" data-i18n="marcar.reverse">Reverse</button>
          <button type="button" data-mode="holo" data-i18n="marcar.holo">Holo</button>
        </div>
      </div>
      <div class="control">
        <span class="control-etiqueta" data-i18n="filtre.etiqueta">Col·lecció</span>
        <!-- Filtre de col·lecció: es combina amb el cercador de text -->
        <div id="filtre-colleccio" class="segmentat">
          <button type="button" class="actiu" data-filtre="totes" data-i18n="filtre.totes">Totes</button>
          <button type="button" data-filtre="tinc" data-i18n="filtre.tinc">Les tinc</button>
          <button type="button" data-filtre="falten" data-i18n="filtre.falten">Em falten</button>
        </div>
      </div>
      <!-- Filtres desplegables: es combinen amb el cercador i el filtre de col·lecció.
           Les opcions les omple el JavaScript a partir de les dades del set. -->
      <div class="control">
        <label for="filtre-raresa" data-i18n="filtre.raresa">Raresa</label>
        <select id="filtre-raresa"></select>
      </div>
      <div class="control">
        <label for="filtre-tipus" data-i18n="filtre.tipus">Tipus d'energia</label>
        <select id="filtre-tipus"></select>
      </div>
      <div class="control">
        <label for="filtre-categoria" data-i18n="filtre.categoria">Categoria</label>
        <select id="filtre-categoria"></select>
      </div>
      <!-- Ordenació de la graella: les opcions són fixes, així el canvi
           d'idioma les retradueix sense haver de reconstruir-les -->
      <div class="control">
        <label for="ordre-graella" data-i18n="ordre.etiqueta">Ordena per</label>
        <select id="ordre-graella">
          <option value="numero" data-i18n="ordre.numero">Número de col·lecció</option>
          <option value="preu" data-i18n="ordre.preu">Preu (més cara primer)</option>
          <option value="artista" data-i18n="ordre.artista">Il·lustrador (A-Z)</option>
          <option value="pokedex" data-i18n="ordre.pokedex">Número de Pokédex</option>
        </select>
      </div>
      <div class="control">
        <label for="selector-versio" data-i18n="versio.etiqueta">Versió de les dades</label>
        <select id="selector-versio"></select>
      </div>
      <button id="boto-actualitza" class="boto-accent" data-i18n="actualitza.boto">
        Actualitza dades
      </button>
    </div>
  </header>

  <main class="contingut">
    <!-- Panell d'estadístiques plegable: progrés, valor i cost de completar (stats.js) -->
    <section id="panell-estad" class="estad" hidden>
      <button type="button" id="estad-capcalera" class="estad-capcalera"
              aria-expanded="true" aria-controls="estad-cos">
        <span data-i18n="estad.titol">Estadístiques de la col·lecció</span>
        <span class="estad-fletxa" aria-hidden="true">▾</span>
      </button>
      <div id="estad-cos" class="estad-cos">
        <div class="estad-objectiu">
          <div class="control">
            <label for="estad-abast" data-i18n="estad.objectiu">Objectiu de compleció</label>
            <!-- Els textos de les opcions els posa stats.js (porten el total de cartes) -->
            <select id="estad-abast">
              <option value="base">Set base</option>
              <option value="complet">Set complet</option>
            </select>
          </div>
          <label class="estad-reverses">
            <input type="checkbox" id="estad-reverses">
            <span data-i18n="estad.ambReverses">Comptar les reverse holo</span>
          </label>
        </div>
        <div id="estad-barres" class="estad-barres"></div>
        <div id="estad-xifres" class="estad-xifres"></div>
      </div>
    </section>

    <p id="missatge" class="missatge" hidden></p>
    <div id="graella" class="graella"></div>

    <!-- Vista d'àlbum: dues pàgines obertes amb butxaques 3x3 (album.js) -->
    <section id="album" class="album" hidden>
      <div class="album-nav">
        <button type="button" id="album-anterior" class="album-fletxa">‹</button>
        <span id="album-indicador" class="album-indicador"></span>
        <button type="button" id="album-seguent" class="album-fletxa">›</button>
      </div>
      <div id="album-llibre" class="album-llibre"></div>
    </section>

    <!-- Zoom de carta: la imatge gran per sobre de tot (clic fora, × o Esc per tancar) -->
    <div id="zoom" class="zoom" hidden>
      <div class="zoom-fitxa" role="dialog" aria-modal="true" aria-labelledby="zoom-nom">
        <!-- L'aria-label del botó el posa el JavaScript (canvia amb l'idioma) -->
        <button type="button" id="zoom-tancar" class="zoom-tancar">×</button>
        <img id="zoom-imatge" class="zoom-imatge" alt="">
        <div class="zoom-info">
          <span id="zoom-numero" class="zoom-numero"></span>
          <span id="zoom-nom" class="zoom-nom"></span>
          <span id="zoom-raresa" class="zoom-raresa"></span>
        </div>
        <!-- Files de comptadors per variant: les omple el JavaScript en obrir el zoom -->
        <div id="zoom-variants" class="zoom-variants"></div>
        <button type="button" id="zoom-graella" class="zoom-graella" data-i18n="zoom.veureGraella">
          Veure a la graella
        </button>
        <p class="zoom-ajuda" data-i18n="zoom.ajuda">Clic fora o tecla Esc per tancar</p>
      </div>
    </div>

    <!-- Selector d'expansions: panell modal amb la llista de sets, cerca i
         progrés de cadascun. La llista l'omple selector-expansions.js. -->
    <dialog id="selector-expansions" class="selector-expansions">
      <div class="expansions-capcalera">
        <input id="expansions-cerca" type="search" autocomplete="off"
               placeholder="" data-i18n-placeholder="expansions.cerca">
        <!-- Botonet per invertir l'ordre per data (text i títol els posa el JS) -->
        <button type="button" id="expansions-ordre" class="expansions-ordre"></button>
      </div>
      <div id="expansions-llista" class="expansions-llista"></div>
      <p id="expansions-buit" class="expansions-buit"
         data-i18n="expansions.capResultat" hidden></p>
      <footer class="expansions-peu">
        <label class="expansions-tema">
          <input type="checkbox" id="tema-per-set">
          <span data-i18n="expansions.temaPerSet">Tema segons l'expansió</span>
        </label>
      </footer>
    </dialog>
  </main>

  <footer class="peu">
    <!-- Barra d'eines de la col·lecció: progrés i còpia de seguretat -->
    <div class="eines-colleccio">
      <span id="colleccio-total" class="colleccio-total"></span>
      <button type="button" id="boto-exportar" class="boto-suau" data-i18n="colleccio.exportar">Exportar</button>
      <button type="button" id="boto-importar" class="boto-suau" data-i18n="colleccio.importar">Importar</button>
      <button type="button" id="boto-buidar" class="boto-suau boto-suau--perill" data-i18n="colleccio.buidar">Buidar</button>
      <input id="fitxer-importar" type="file" accept=".json,application/json" hidden>
    </div>
    <div class="peu-fila">
      <!-- El símbol del set l'omple el JavaScript amb la URL de les dades -->
      <img id="simbol-set" class="simbol-set" src="" alt="" hidden>
      <span id="peu-dades"></span>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
